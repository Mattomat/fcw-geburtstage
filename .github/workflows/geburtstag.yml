name: Geburtstags-Mail
on:
  schedule:   # GitHub garantiert keine Uhrzeit: mehrere Versuche, send.py sendet nur einmal pro Tag
    - cron: "17 5 * * *"
    - cron: "43 6 * * *"
    - cron: "23 8 * * *"
    - cron: "11 10 * * *"
  workflow_dispatch:
    inputs:
      datum:
        description: "Test: Datum TT.MM (leer = heute)"
        required: false
permissions:
  contents: write
concurrency: geburtstag
jobs:
  senden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 send.py "${{ inputs.datum }}"
        env:
          GMX_PASSWORD: ${{ secrets.GMX_PASSWORD }}
      - name: Protokoll sichern
        if: always()
        run: |
          git add gesendet.txt 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git -c user.name=fcw-bot -c user.email=fcw-bot@users.noreply.github.com commit -m "Protokoll"
          git push
